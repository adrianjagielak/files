            // Funkcja do tasowania tablicy (Fisher-Yates shuffle)
            const shuffleArray = (array) => {
                const newArray = [...array];
                for (let i = newArray.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
                }
                return newArray;
            };

            // Funkcja do randomizacji odpowiedzi w pytaniu
            const shuffleQuestionOptions = (question) => {
                const indices = question.options.map((_, i) => i);
                const shuffledIndices = shuffleArray(indices);

                // Obsługa zarówno single correct (number) jak i multiple correct (array)
                const isMultiple = Array.isArray(question.correct);
                const newCorrect = isMultiple
                    ? question.correct.map((c) => shuffledIndices.indexOf(c))
                    : shuffledIndices.indexOf(question.correct);

                return {
                    ...question,
                    options: shuffledIndices.map((i) => question.options[i]),
                    correct: newCorrect,
                    isMultipleCorrect: isMultiple,
                };
            };

                if (questions.length === 0) {

                    if (answered) return;

                    if (isMultiple) {
                        // Dla pytań z 2 odpowiedziami - toggle checkbox
                        if (selectedAnswers.includes(index)) {
                            setSelectedAnswers(
                                selectedAnswers.filter((i) => i !== index),
                            );
                        } else {
                            if (selectedAnswers.length < 2) {
                                setSelectedAnswers([...selectedAnswers, index]);
                            }
                        }
                    } else {
                        // Dla pytań z 1 odpowiedzią - klasyczne radio
                        setSelectedAnswers([index]);
                    }
                };

                const submitAnswer = () => {
                    if (selectedAnswers.length === 0) return;
                    if (isMultiple && selectedAnswers.length !== 2) return;

                    setAnswered(true);

                    let isCorrect = false;
                    if (isMultiple) {
                        // Sprawdź czy obie odpowiedzi są poprawne
                        const correctSet = new Set(currentQ.correct);
                        const selectedSet = new Set(selectedAnswers);
                        isCorrect =
                            correctSet.size === selectedSet.size &&
                            [...correctSet].every((x) => selectedSet.has(x));
                    } else {
                        isCorrect = selectedAnswers[0] === currentQ.correct;
                    }

                    setUserAnswers([
                        ...userAnswers,
                        {
                            question: currentQuestion,
                            selected: selectedAnswers,
                            correct: isCorrect,
                        },
                    ]);

                    if (isCorrect) {
                        setScore(score + 1);
                    }
                };

                const nextQuestion = () => {
                    if (currentQuestion < questions.length - 1) {
                        setCurrentQuestion(currentQuestion + 1);
                        setSelectedAnswers([]);
                        setAnswered(false);
                    } else {
                        setShowResult(true);
                    }
                };

                const restartQuiz = () => {
                    const shuffledQuestions = shuffleArray(QUESTIONS_DATA).map(
                        (q) => shuffleQuestionOptions(q),
                    );
                    setQuestions(shuffledQuestions);
                    setCurrentQuestion(0);
                    setScore(0);
                    setShowResult(false);
                    setSelectedAnswers([]);
                    setAnswered(false);
                    setUserAnswers([]);
                };

                const getScoreMessage = () => {
                    const percentage = (score / questions.length) * 100;
                    if (percentage >= 90)
                        return {
                            text: "Fenomenalnie! Jesteś mistrzem!",
                            emoji: "🏆",
                        };
                    if (percentage >= 75)
                        return {
                            text: "Świetnie! Bardzo dobra znajomość!",
                            emoji: "🌟",
                        };
                    if (percentage >= 60)
                        return { text: "Dobrze! Solidna wiedza!", emoji: "👍" };
                    if (percentage >= 50)
                        return {
                            text: "Nieźle! Jeszcze trochę nauki!",
                            emoji: "📚",
                        };
                    return {
                        text: "Trzeba popracować! Do przodu!",
                        emoji: "💪",
                    };
                };

                const isCorrectAnswer = (index) => {
                    if (isMultiple) {
                        return currentQ.correct.includes(index);
                    }
                    return index === currentQ.correct;
                };

                                        display: "inline-block",

                                                style={{
                                                    display: "inline-block",
                                                    padding: "0.5rem 1rem",
                                                    background: "#f3e8ff",
                                                    borderRadius: "9999px",
                                                    marginBottom: "1rem",
                                                }}
                                            >
                                                <span
                                                    style={{
                                                        fontSize: "0.875rem",
                                                        fontWeight: "600",
                                                        color: "#6b21a8",
                                                    }}
                                                >
                                                    {currentQ.category}
                                                </span>
                                            </div>
                                            <h2
                                                style={{
                                                    fontSize:
                                                        "clamp(1.5rem, 3vw, 1.875rem)",
                                                    fontWeight: "bold",
                                                    color: "#1f2937",
                                                    lineHeight: "1.625",
                                                    fontFamily:
                                                        "'Playfair Display', serif",
                                                }}
                                            >
                                                {currentQ.question}
                                            </h2>
                                            {isMultiple && !answered && (
                                                <p
                                                    style={{
                                                        marginTop: "0.75rem",
                                                        fontSize: "0.95rem",
                                                        color: "#7c3aed",
                                                        fontWeight: "600",
                                                    }}
                                                >
                                                    💡 Zaznacz 2 poprawne
                                                    odpowiedzi
                                                </p>
                                            )}
                                        </div>

                                        {/* Options */}
                                        <div
                                            style={{
                                                display: "flex",
                                                flexDirection: "column",
                                                gap: "1rem",
                                                marginBottom: "2rem",
                                            }}
                                        >
                                            {currentQ.options.map(
                                                (option, index) => {
                                                    const isSelected =
                                                        selectedAnswers.includes(
                                                            index,
                                                        );
                                                    const showCorrect =
                                                        answered &&
                                                        isCorrectAnswer(index);
                                                    const showWrong =
                                                        answered &&
                                                        isSelected &&
                                                        !isCorrectAnswer(index);

                                                    let backgroundColor =
                                                        "#f9fafb";
                                                    let borderColor = "#e5e7eb";
                                                    let className =
                                                        "option-button";

                                                    if (showCorrect) {
                                                        backgroundColor =
                                                            "#f0fdf4";
                                                        borderColor = "#22c55e";
                                                        className +=
                                                            " correct-answer";
                                                    } else if (showWrong) {
                                                        backgroundColor =
                                                            "#fef2f2";
                                                        borderColor = "#ef4444";
                                                    } else if (
                                                        isSelected &&
                                                        !answered
                                                    ) {
                                                        backgroundColor =
                                                            "#f3e8ff";
                                                        borderColor = "#a855f7";
                                                    }

                                                    return (
                                                        <button
                                                            key={index}
                                                            onClick={() =>
                                                                handleAnswer(
                                                                    index,
                                                                )
                                                            }
                                                            disabled={answered}
                                                            className={
                                                                className
                                                            }
                                                            style={{
                                                                width: "100%",
                                                                padding:
                                                                    "1.25rem",
                                                                borderRadius:
                                                                    "1rem",
                                                                textAlign:
                                                                    "left",
                                                                fontWeight:
                                                                    "500",
                                                                border: `2px solid ${borderColor}`,
                                                                background:
                                                                    backgroundColor,
                                                                cursor: answered
                                                                    ? "default"
                                                                    : "pointer",
                                                                opacity:
                                                                    answered &&
                                                                    !isSelected &&
                                                                    !isCorrectAnswer(
                                                                        index,
                                                                    )
                                                                        ? "0.5"
                                                                        : "1",
                                                                animationDelay: `${index * 0.1}s`,
                                                            }}
                                                        >
                                                            <div
                                                                style={{
                                                                    display:
                                                                        "flex",
                                                                    alignItems:
                                                                        "center",
                                                                    justifyContent:
                                                                        "space-between",
                                                                }}
                                                            >
                                                                <div
                                                                    style={{
                                                                        display:
                                                                            "flex",
                                                                        alignItems:
                                                                            "center",
                                                                        flex: 1,
                                                                    }}
                                                                >
                                                                    {isMultiple &&
                                                                        !answered && (
                                                                            <div
                                                                                className={`checkbox-custom ${isSelected ? "checked" : ""}`}
                                                                            />
                                                                        )}
                                                                    <span
                                                                        style={{
                                                                            fontSize:
                                                                                "1.125rem",
                                                                        }}
                                                                    >
                                                                        {option}
                                                                    </span>
                                                                </div>
                                                                {showCorrect && (
                                                                    <CheckCircle
                                                                        size={
                                                                            28
                                                                        }
                                                                        style={{
                                                                            color: "#16a34a",
                                                                        }}
                                                                    />
                                                                )}
                                                                {showWrong && (
                                                                    <XCircle
                                                                        size={
                                                                            28
                                                                        }
                                                                        style={{
                                                                            color: "#dc2626",
                                                                        }}
                                                                    />
                                                                )}
                                                            </div>
                                                        </button>
                                                    );
                                                },
                                            )}
                                        </div>

                                        {/* Explanation */}
                                        {answered && (
                                            <div
                                                className="explanation-box"
                                                style={{
                                                    background: userAnswers[
                                                        userAnswers.length - 1
                                                    ]?.correct
                                                        ? "#ecfdf5"
                                                        : "#fff7ed",
                                                    border: `2px solid ${userAnswers[userAnswers.length - 1]?.correct ? "#86efac" : "#fdba74"}`,
                                                    borderRadius: "1rem",
                                                    padding: "1.5rem",
                                                    marginBottom: "2rem",
                                                }}
                                            >
                                                <h3
                                                    style={{
                                                        fontSize: "1.125rem",
                                                        fontWeight: "bold",
                                                        marginBottom: "0.75rem",
                                                        color: userAnswers[
                                                            userAnswers.length -
                                                                1
                                                        ]?.correct
                                                            ? "#166534"
                                                            : "#9a3412",
                                                        fontFamily:
                                                            "'Playfair Display', serif",
                                                    }}
                                                >
                                                    {userAnswers[
                                                        userAnswers.length - 1
                                                    ]?.correct
                                                        ? "✓ Brawo!"
                                                        : "ℹ️ Wyjaśnienie"}
                                                </h3>
                                                <p
                                                    style={{
                                                        fontSize: "1rem",
                                                        lineHeight: "1.75",
                                                        color: "#374151",
                                                    }}
                                                >
                                                    {currentQ.explanation}
                                                </p>
                                            </div>
                                        )}

                                        {/* Submit/Next Button */}
                                        {!answered ? (
                                            <button
                                                onClick={submitAnswer}
                                                disabled={
                                                    selectedAnswers.length ===
                                                        0 ||
                                                    (isMultiple &&
                                                        selectedAnswers.length !==
                                                            2)
                                                }
                                                style={{
                                                    width: "100%",
                                                    padding: "1rem 1.5rem",
                                                    background:
                                                        selectedAnswers.length ===
                                                            0 ||
                                                        (isMultiple &&
                                                            selectedAnswers.length !==
                                                                2)
                                                            ? "#cbd5e1"
                                                            : "linear-gradient(135deg, #667eea 0%, #764ba2 100%)",
                                                    color: "white",
                                                    borderRadius: "1rem",
                                                    fontWeight: "bold",
                                                    fontSize: "1.125rem",
                                                    border: "none",
                                                    cursor:
                                                        selectedAnswers.length ===
                                                            0 ||
                                                        (isMultiple &&
                                                            selectedAnswers.length !==
                                                                2)
                                                            ? "not-allowed"
                                                            : "pointer",
                                                    transition: "all 0.3s",
                                                    opacity:
                                                        selectedAnswers.length ===
                                                            0 ||
                                                        (isMultiple &&
                                                            selectedAnswers.length !==
                                                                2)
                                                            ? "0.5"
                                                            : "1",
                                                }}
                                                onMouseOver={(e) => {
                                                    if (
                                                        !(
                                                            selectedAnswers.length ===
                                                                0 ||
                                                            (isMultiple &&
                                                                selectedAnswers.length !==
                                                                    2)
                                                        )
                                                    ) {
                                                        e.currentTarget.style.transform =
                                                            "scale(1.05)";
                                                        e.currentTarget.style.boxShadow =
                                                            "0 20px 25px -5px rgba(0, 0, 0, 0.1)";
                                                    }
                                                }}
                                                onMouseOut={(e) => {
                                                    e.currentTarget.style.transform =
                                                        "scale(1)";
                                                    e.currentTarget.style.boxShadow =
                                                        "none";
                                                }}
                                            >
                                                Sprawdź odpowiedź
                                            </button>
                                        ) : (
                                            <button
                                                onClick={nextQuestion}
                                                style={{
                                                    width: "100%",
                                                    padding: "1rem 1.5rem",
                                                    background:
                                                        "linear-gradient(135deg, #667eea 0%, #764ba2 100%)",
                                                    color: "white",
                                                    borderRadius: "1rem",
                                                    fontWeight: "bold",
                                                    fontSize: "1.125rem",
                                                    border: "none",
                                                    cursor: "pointer",
                                                    transition: "all 0.3s",
                                                }}
                                                onMouseOver={(e) => {
                                                    e.currentTarget.style.transform =
                                                        "scale(1.05)";
                                                    e.currentTarget.style.boxShadow =
                                                        "0 20px 25px -5px rgba(0, 0, 0, 0.1)";
                                                }}
                                                onMouseOut={(e) => {
                                                    e.currentTarget.style.transform =
                                                        "scale(1)";
                                                    e.currentTarget.style.boxShadow =
                                                        "none";
                                                }}
                                            >
                                                {currentQuestion <
                                                questions.length - 1
                                                    ? "Następne pytanie →"
                                                    : "Zobacz wyniki →"}
                                            </button>
                                        )}
                                    </div>
                                </div>
                            ) : (
                                <div
                                    className="result-card"
                                    style={{
                                        background: "white",
                                        borderRadius: "1.5rem",
                                        boxShadow:
                                            "0 25px 50px -12px rgba(0, 0, 0, 0.25)",
                                        padding: "3rem 2rem",
                                        textAlign: "center",
                                    }}
                                >
                                    <div style={{ marginBottom: "2rem" }}>
                                        <div
                                            style={{
                                                display: "inline-block",
                                                padding: "1.5rem",
                                                background:
                                                    "linear-gradient(135deg, #667eea 0%, #764ba2 100%)",
                                                borderRadius: "9999px",
                                                marginBottom: "1.5rem",
                                            }}
                                        >
                                            <Award
                                                size={80}
                                                strokeWidth={1.5}
                                                style={{ color: "white" }}
                                            />
                                        </div>
                                        <h2
                                            style={{
                                                fontSize:
                                                    "clamp(2.25rem, 5vw, 3rem)",
                                                fontWeight: "bold",
                                                marginBottom: "1rem",
                                                color: "#1f2937",
                                                fontFamily:
                                                    "'Playfair Display', serif",
                                            }}
                                        >
                                            Gratulacje!
                                        </h2>
                                        <p
                                            style={{
                                                fontSize: "3.75rem",
                                                marginBottom: "1rem",
                                            }}
                                        >
                                            {getScoreMessage().emoji}
                                        </p>
                                        <p
                                            style={{
                                                fontSize: "1.5rem",
                                                color: "#374151",
                                                marginBottom: "1.5rem",
                                            }}
                                        >
                                            {getScoreMessage().text}
                                        </p>
                                    </div>

                                    <div
                                        style={{
                                            background:
                                                "linear-gradient(135deg, #ede9fe 0%, #ddd6fe 100%)",
                                            borderRadius: "1rem",
                                            padding: "2rem",
                                            marginBottom: "2rem",
                                        }}
                                    >
                                        <div
                                            style={{
                                                fontSize: "3.75rem",
                                                fontWeight: "bold",
                                                marginBottom: "0.5rem",
                                                color: "#7c3aed",
                                                fontFamily:
                                                    "'Playfair Display', serif",
                                            }}
                                        >
                                            {score}/{questions.length}
                                        </div>
                                        <p
                                            style={{
                                                fontSize: "1.125rem",
                                                color: "#374151",
                                            }}
                                        >
                                            Poprawnych odpowiedzi
                                        </p>
                                        <div
                                            style={{
                                                marginTop: "1rem",
                                                fontSize: "1.875rem",
                                                fontWeight: "bold",
                                                color: "#6d28d9",
                                                fontFamily:
                                                    "'Playfair Display', serif",
                                            }}
                                        >
                                            {(
                                                (score / questions.length) *
                                                100
                                            ).toFixed(0)}
                                            %
                                        </div>
                                    </div>

                                    <button
                                        onClick={restartQuiz}
                                        style={{
                                            display: "inline-flex",
                                            alignItems: "center",
                                            gap: "0.75rem",
                                            padding: "1rem 2rem",
                                            background:
                                                "linear-gradient(135deg, #667eea 0%, #764ba2 100%)",
                                            color: "white",
                                            borderRadius: "1rem",
                                            fontWeight: "bold",
                                            fontSize: "1.125rem",
                                            border: "none",
                                            cursor: "pointer",
                                            transition: "all 0.3s",
                                        }}
                                        onMouseOver={(e) => {
                                            e.currentTarget.style.transform =
                                                "scale(1.05)";
                                            e.currentTarget.style.boxShadow =
                                                "0 20px 25px -5px rgba(0, 0, 0, 0.1)";
                                        }}
                                        onMouseOut={(e) => {
                                            e.currentTarget.style.transform =
                                                "scale(1)";
                                            e.currentTarget.style.boxShadow =
                                                "none";
                                        }}
                                    >
                                        <RefreshCw size={24} />
                                        Spróbuj ponownie
                                    </button>
                                </div>
                            )}

                            {/* Footer */}
                            <div
                                style={{
                                    textAlign: "center",
                                    marginTop: "2rem",
                                    color: "#e0e7ff",
                                }}
                            >
                                <p style={{ fontSize: "0.875rem" }}>
                                    🧠 Psychologia Osobowości - Poziom
                                    Zaawansowany
                                </p>
                            </div>
                        </div>
                    </div>
                );
            };

            ReactDOM.render(
                <PsychologyQuiz />,
                document.getElementById("root"),
            );
        </script>
    </body>
</html>
