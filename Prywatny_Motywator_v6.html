<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Twoja Codzienna Motywacja</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: flex-start;
                padding: 20px;
                padding-top: 40px;
            }

            .container {
                background: white;
                border-radius: 20px;
                padding: 40px;
                max-width: 600px;
                width: 100%;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            }

            h1 {
                color: #667eea;
                text-align: center;
                margin-bottom: 30px;
                font-size: 2em;
            }

            .form-group {
                margin-bottom: 20px;
            }

            label {
                display: block;
                margin-bottom: 8px;
                color: #333;
                font-weight: 600;
            }

            input[type="text"],
            textarea {
                width: 100%;
                padding: 12px;
                border: 2px solid #e0e0e0;
                border-radius: 8px;
                font-size: 16px;
                transition: border-color 0.3s;
            }

            input[type="text"]:focus,
            textarea:focus {
                outline: none;
                border-color: #667eea;
            }

            textarea {
                min-height: 100px;
                resize: vertical;
            }

            button {
                width: 100%;
                padding: 15px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 18px;
                font-weight: 600;
                cursor: pointer;
                transition:
                    transform 0.2s,
                    box-shadow 0.2s;
            }

            button:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
            }

            button:active {
                transform: translateY(0);
            }

            button:disabled {
                opacity: 0.6;
                cursor: not-allowed;
                transform: none;
            }

            .hidden {
                display: none;
            }

            .motivation-content {
                margin-top: 20px;
            }

            .motivation-text {
                background: #f8f9fa;
                padding: 25px;
                border-radius: 12px;
                border-left: 5px solid #667eea;
                margin-bottom: 20px;
                line-height: 1.8;
                color: #333;
                white-space: pre-wrap;
                min-height: 60px;
                opacity: 0;
                transform: translateY(20px);
                animation: slideIn 0.5s ease forwards;
                transition: all 0.15s ease;
            }

            .affirmation {
                background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
                color: white;
                padding: 20px;
                border-radius: 12px;
                text-align: center;
                font-size: 1.2em;
                font-weight: 600;
                margin-bottom: 20px;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
                min-height: 60px;
                opacity: 0;
                transform: translateY(20px);
                animation: slideIn 0.5s ease forwards;
                transition: all 0.15s ease;
            }

            .action-item {
                background: #e8f5e9;
                padding: 20px;
                border-radius: 12px;
                border-left: 5px solid #4caf50;
                margin-bottom: 20px;
                min-height: 60px;
                opacity: 0;
                transform: translateY(20px);
                animation: slideIn 0.5s ease forwards;
                transition: all 0.15s ease;
            }

            @keyframes slideIn {
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .action-item h3 {
                color: #2e7d32;
                margin-bottom: 10px;
            }

            .button-group {
                display: flex;
                gap: 10px;
                margin-top: 20px;
            }

            .button-group button {
                flex: 1;
            }

            .btn-secondary {
                background: #6c757d;
            }

            .btn-secondary:hover {
                box-shadow: 0 10px 20px rgba(108, 117, 125, 0.3);
            }

            .loading {
                text-align: center;
                padding: 40px;
                color: #667eea;
            }

            .spinner {
                border: 4px solid #f3f3f3;
                border-top: 4px solid #667eea;
                border-radius: 50%;
                width: 40px;
                height: 40px;
                animation: spin 1s linear infinite;
                margin: 0 auto 20px;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }

            .error {
                background: #ffebee;
                color: #c62828;
                padding: 20px;
                border-radius: 12px;
                margin-top: 20px;
                border-left: 5px solid #c62828;
            }

            .streaming-cursor {
                display: inline-block;
                width: 8px;
                height: 1em;
                background: #667eea;
                animation: blink 1s infinite;
                margin-left: 2px;
            }

            @keyframes blink {
                0%,
                50% {
                    opacity: 1;
                }
                51%,
                100% {
                    opacity: 0;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>💪 Twoja Codzienna Motywacja</h1>

            <div id="formScreen">
                <div class="form-group">
                    <label for="name">📝 Jak masz na imię?</label>
                    <input type="text" id="name" placeholder="Twoje imię..." />
                </div>

                <div class="form-group">
                    <label for="feeling">💭 Jak się dziś czujesz?</label>
                    <textarea
                        id="feeling"
                        placeholder="Opisz swoje obecne samopoczucie..."
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="goals">🎯 Jakie są Twoje cele?</label>
                    <textarea
                        id="goals"
                        placeholder="Co chcesz osiągnąć?..."
                    ></textarea>
                </div>

                <button id="generateBtn">Generuj Motywację 🚀</button>
            </div>

            <div id="motivationScreen" class="hidden">
                <div id="loadingState" class="loading">
                    <div class="spinner"></div>
                    <p>Przygotowuję Twoją motywację...</p>
                </div>

                <div id="motivationContent" class="motivation-content hidden">
                    <p
                        style="
                            color: #667eea;
                            font-size: 1.2em;
                            margin-bottom: 20px;
                        "
                        id="greeting"
                    ></p>

                    <div
                        class="motivation-text hidden"
                        id="motivationBox"
                    ></div>

                    <div class="affirmation hidden" id="affirmationBox">✨</div>

                    <div class="action-item hidden" id="actionBox">
                        <h3>📋 Twoje zadanie na dziś:</h3>
                        <p></p>
                    </div>
                </div>

                <div id="errorState" class="error hidden"></div>

                <div class="button-group">
                    <button id="refreshBtn" class="hidden">
                        🔄 Nowa Motywacja
                    </button>
                    <button id="backBtn" class="btn-secondary">
                        ⬅️ Powrót
                    </button>
                </div>
            </div>
        </div>

        <script>
            let userData = {};

            document
                .getElementById("generateBtn")
                .addEventListener("click", async () => {
                    const name = document.getElementById("name").value.trim();
                    const feeling = document
                        .getElementById("feeling")
                        .value.trim();
                    const goals = document.getElementById("goals").value.trim();

                    if (!name || !feeling || !goals) {
                        alert("Proszę wypełnić wszystkie pola");
                        return;
                    }

                    userData = { name, feeling, goals };
                    showMotivationScreen();
                    await generateMotivation();
                });

            document
                .getElementById("refreshBtn")
                .addEventListener("click", async () => {
                    await generateMotivation();
                });

            document.getElementById("backBtn").addEventListener("click", () => {
                document
                    .getElementById("formScreen")
                    .classList.remove("hidden");
                document
                    .getElementById("motivationScreen")
                    .classList.add("hidden");
            });

            function showMotivationScreen() {
                document.getElementById("formScreen").classList.add("hidden");
                document
                    .getElementById("motivationScreen")
                    .classList.remove("hidden");
                document
                    .getElementById("loadingState")
                    .classList.remove("hidden");
                document
                    .getElementById("motivationContent")
                    .classList.add("hidden");
                document.getElementById("errorState").classList.add("hidden");
                document.getElementById("refreshBtn").classList.add("hidden");
            }

            async function generateMotivation() {
                const apiKey = atob(
                    "c2stcHJvai01QVFNaVBnOE5rTkQxQ3JscUhyelNrMWtMQUN1V1VIUTZyZFdzdGpfTG1Cai02YjJ6ZkhRUGxKVXVoMmNvRG80X2dwVkVUemJaYVQzQmxia0ZKcFNrOWdUQWJlYVNQQjFkU0tGc0lPekVCTjZFYkpKUWZCNGVWVURJU3lya3hXbUtPX3EtWl9JVGllRW5ZUVYwcWlUZml6WVA5OEE=",
                );

                const systemPrompt = `Jesteś osobistym coachem motywacyjnym. Użytkownik poda Ci swoje imię, obecne samopoczucie i cele.

Odpowiedz w następującym formacie (używając dokładnie tych nagłówków):

===MOTYWACJA===
[Krótki, ciepły i inspirujący tekst motywacyjny (2-3 zdania) skierowany bezpośrednio do użytkownika]

===AFIRMACJA===
[Jedna potężna, pozytywna afirmacja w pierwszej osobie (np. 'Jestem...')]

===DZIAŁANIE===
[Jedno konkretne, praktyczne działanie na dziś (jasne i wykonalne zadanie)]

Ton: ciepły, empatyczny, ale konkretny. Dopasuj motywację do samopoczucia i celów użytkownika.`;

                // Reset display
                document
                    .getElementById("loadingState")
                    .classList.remove("hidden");
                document
                    .getElementById("motivationContent")
                    .classList.add("hidden");
                document.getElementById("errorState").classList.add("hidden");

                // Hide all boxes for next generation
                document
                    .getElementById("motivationBox")
                    .classList.add("hidden");
                document
                    .getElementById("affirmationBox")
                    .classList.add("hidden");
                document.getElementById("actionBox").classList.add("hidden");

                try {
                    const userPrompt = `Imię: ${userData.name}
Obecne samopoczucie: ${userData.feeling}
Cele: ${userData.goals}

Wygeneruj spersonalizowaną treść motywacyjną na dziś.`;

                    const response = await fetch(
                        "https://api.openai.com/v1/chat/completions",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                Authorization: `Bearer ${apiKey}`,
                            },
                            body: JSON.stringify({
                                model: "gpt-5.2",
                                messages: [
                                    { role: "system", content: systemPrompt },
                                    { role: "user", content: userPrompt },
                                ],
                                stream: true,
                            }),
                        },
                    );

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error?.message || "Błąd API");
                    }

                    await handleStreamingResponse(response);
                } catch (error) {
                    showError(
                        `Błąd: ${error.message}. Sprawdź klucz API i połączenie internetowe.`,
                    );
                }
            }

            async function handleStreamingResponse(response) {
                const motivationBox = document.getElementById("motivationBox");
                const affirmationBox =
                    document.getElementById("affirmationBox");
                const actionBox = document.getElementById("actionBox");
                const actionText = actionBox.querySelector("p");

                // State tracking
                let fullText = "";
                let shownSections = {
                    motywacja: false,
                    afirmacja: false,
                    dzialanie: false,
                };

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";

                try {
                    while (true) {
                        const { done, value } = await reader.read();

                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split("\n");
                        buffer = lines.pop();

                        for (const line of lines) {
                            if (line.startsWith("data: ")) {
                                const data = line.slice(6);

                                if (data === "[DONE]") {
                                    // Show any remaining sections
                                    const sections = parseFullText(fullText);

                                    if (
                                        !shownSections.motywacja &&
                                        sections.motywacja
                                    ) {
                                        showCard(
                                            "motywacja",
                                            sections.motywacja,
                                        );
                                        shownSections.motywacja = true;
                                    }
                                    if (
                                        !shownSections.afirmacja &&
                                        sections.afirmacja
                                    ) {
                                        showCard(
                                            "afirmacja",
                                            sections.afirmacja,
                                        );
                                        shownSections.afirmacja = true;
                                    }
                                    if (
                                        !shownSections.dzialanie &&
                                        sections.dzialanie
                                    ) {
                                        showCard(
                                            "dzialanie",
                                            sections.dzialanie,
                                        );
                                        shownSections.dzialanie = true;
                                    }

                                    document
                                        .getElementById("refreshBtn")
                                        .classList.remove("hidden");
                                    return;
                                }

                                try {
                                    const parsed = JSON.parse(data);
                                    const delta =
                                        parsed.choices[0]?.delta?.content;

                                    if (delta) {
                                        fullText += delta;
                                        const sections =
                                            parseFullText(fullText);

                                        // Show first card when we detect the second section starting
                                        if (
                                            !shownSections.motywacja &&
                                            fullText.includes("===AFIRMACJA===")
                                        ) {
                                            showCard(
                                                "motywacja",
                                                sections.motywacja,
                                            );
                                            shownSections.motywacja = true;
                                        }

                                        // Show second card when we detect the third section starting
                                        if (
                                            !shownSections.afirmacja &&
                                            fullText.includes("===DZIAŁANIE===")
                                        ) {
                                            showCard(
                                                "afirmacja",
                                                sections.afirmacja,
                                            );
                                            shownSections.afirmacja = true;
                                        }
                                    }
                                } catch (e) {
                                    // Ignore parsing errors
                                }
                            }
                        }
                    }

                    // Final cleanup - show any sections we haven't shown yet
                    const sections = parseFullText(fullText);

                    if (!shownSections.motywacja && sections.motywacja) {
                        showCard("motywacja", sections.motywacja);
                        shownSections.motywacja = true;
                    }
                    if (!shownSections.afirmacja && sections.afirmacja) {
                        showCard("afirmacja", sections.afirmacja);
                        shownSections.afirmacja = true;
                    }
                    if (!shownSections.dzialanie && sections.dzialanie) {
                        showCard("dzialanie", sections.dzialanie);
                        shownSections.dzialanie = true;
                    }

                    document
                        .getElementById("refreshBtn")
                        .classList.remove("hidden");
                } catch (error) {
                    console.error("Streaming error:", error);
                    showError(
                        "Błąd podczas odbierania odpowiedzi: " + error.message,
                    );
                }
            }

            function showCard(section, content) {
                // Hide loading state when showing first card
                if (section === "motywacja") {
                    document
                        .getElementById("loadingState")
                        .classList.add("hidden");
                    document
                        .getElementById("motivationContent")
                        .classList.remove("hidden");
                    document.getElementById("greeting").textContent =
                        `Cześć ${userData.name}! 👋`;
                }

                if (section === "motywacja") {
                    const motivationBox =
                        document.getElementById("motivationBox");
                    motivationBox.innerHTML = content;
                    motivationBox.classList.remove("hidden");
                } else if (section === "afirmacja") {
                    const affirmationBox =
                        document.getElementById("affirmationBox");
                    affirmationBox.innerHTML = "✨ " + content;
                    affirmationBox.classList.remove("hidden");
                } else if (section === "dzialanie") {
                    const actionBox = document.getElementById("actionBox");
                    const actionText = actionBox.querySelector("p");
                    actionText.innerHTML = content;
                    actionBox.classList.remove("hidden");
                }
            }

            function parseFullText(fullText) {
                const sections = {
                    motywacja: "",
                    afirmacja: "",
                    dzialanie: "",
                };

                // Extract content between markers
                const motywacjaMatch = fullText.match(
                    /===MOTYWACJA===\s*([\s\S]*?)(?:===AFIRMACJA===|$)/,
                );
                const afirmacjaMatch = fullText.match(
                    /===AFIRMACJA===\s*([\s\S]*?)(?:===DZIAŁANIE===|$)/,
                );
                const dzialanieMatch = fullText.match(
                    /===DZIAŁANIE===\s*([\s\S]*?)$/,
                );

                if (motywacjaMatch) {
                    sections.motywacja = motywacjaMatch[1].trim();
                }
                if (afirmacjaMatch) {
                    sections.afirmacja = afirmacjaMatch[1].trim();
                }
                if (dzialanieMatch) {
                    sections.dzialanie = dzialanieMatch[1].trim();
                }

                return sections;
            }

            function showError(message) {
                document.getElementById("loadingState").classList.add("hidden");
                document
                    .getElementById("errorState")
                    .classList.remove("hidden");
                document.getElementById("errorState").textContent = message;
            }
        </script>
    </body>
</html>
