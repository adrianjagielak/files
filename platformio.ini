; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = xiao_esp32c6

[env:xiao_esp32c6]
platform = espressif32
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
board_build.partitions = partitions.csv
board_build.flash_size = 4MB
build_flags = 
	-std=gnu++17
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=3
	-DMBEDTLS_DEPRECATED_REMOVED
	-Icomponents/tesla-ble/include
	-Icomponents/tesla-ble/generated/include
	-I${PROJECT_LIBDEPS_DIR}/${PIOENV}/Nanopb
	-DPB_FIELD_32BIT
	-DPB_ENABLE_MALLOC=1
build_unflags = 
	-std=gnu++11
build_src_filter = 
	+<*>
	+<../components/tesla-ble/src/*.cpp>
	+<../components/tesla-ble/generated/src/*.c>
	+<../components/tesla-ble/generated/src/google/protobuf/*.c>
lib_deps = 
	HomeSpan/HomeSpan @ ^2.1.1
	h2zero/NimBLE-Arduino @ ^2.2.1
	nanopb/Nanopb @ ^0.4.91
