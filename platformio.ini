; Tesla BLE HomeKit bridge for Seeed Studio XIAO ESP32-C6.
;
; Uses pioarduino (arduino-esp32 3.x on IDF 5.x) for mbedTLS 3.x
; (required by the Tesla BLE library) and arduino-esp32 >=3.3.0 (HomeSpan).
; The seeed_xiao_esp32c6 board is only defined in pioarduino, not in the
; official espressif32 platform.
; toolchain-riscv32-esp is declared explicitly so PlatformIO installs the
; RISC-V toolchain (riscv32-esp-elf-g++) before the first build.
;
; The yoziru/tesla-ble library is vendored as a git submodule under
; components/tesla-ble. Its source tree is pulled in via build_src_filter
; and extra include paths (library.json is not sufficient because the
; pre-generated nanopb .c files live in components/tesla-ble/generated).

[platformio]
default_envs = xiao_esp32c6

[env:xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform_packages =
    toolchain-riscv32-esp
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

board_build.partitions = partitions.csv
board_build.flash_size = 4MB

extra_scripts = pre:extra_scripts.py

build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DMBEDTLS_DEPRECATED_REMOVED
    -Icomponents/tesla-ble/include
    -Icomponents/tesla-ble/generated/include
    -DPB_FIELD_32BIT
    -DPB_ENABLE_MALLOC=1

build_unflags =
    -std=gnu++11

build_src_filter =
    +<*>
    +<../components/tesla-ble/src/*.cpp>
    +<../components/tesla-ble/generated/src/*.c>
    +<../components/tesla-ble/generated/src/google/protobuf/*.c>

lib_deps =
    HomeSpan/HomeSpan @ ^2.1.1
    h2zero/NimBLE-Arduino @ ^2.2.1
    nanopb/Nanopb @ ^0.4.91
