; Tesla BLE HomeKit bridge for Seeed Studio XIAO ESP32-S3.
;
; The yoziru/tesla-ble library is vendored as a git submodule under
; components/tesla-ble. Its source tree is pulled in via build_src_filter
; and extra include paths (library.json is not sufficient because the
; pre-generated nanopb .c files live in components/tesla-ble/generated).

[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.20
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

board_build.partitions = partitions.csv
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_opi

build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DMBEDTLS_DEPRECATED_REMOVED
    -Icomponents/tesla-ble/include
    -Icomponents/tesla-ble/generated/include
    -DPB_FIELD_32BIT
    -DPB_ENABLE_MALLOC=1

build_unflags =
    -std=gnu++11

build_src_filter =
    +<*>
    +<../components/tesla-ble/src/*.cpp>
    +<../components/tesla-ble/generated/src/*.c>
    +<../components/tesla-ble/generated/src/google/protobuf/*.c>

lib_deps =
    HomeSpan/HomeSpan @ ^2.1.1
    h2zero/NimBLE-Arduino @ ^2.2.1
    nanopb/Nanopb @ ^0.4.91
